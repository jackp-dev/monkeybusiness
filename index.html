<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Page</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 700px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.6;
    color: #ffffff;
    background: #000000;
  }
  h1 { font-size: 1.6em; }
  a { color: #6fb3ff; }
  a:visited { color: #a98fdb; }
  #lock-screen, #content {
    display: block;
  }
  #content { display: none; }
  input[type="password"], input[type="text"], input[type="email"] {
    font-family: inherit;
    font-size: 1em;
    padding: 8px;
    width: 100%;
    max-width: 300px;
    box-sizing: border-box;
    margin-bottom: 10px;
    background: #111;
    color: #fff;
    border: 1px solid #555;
  }
  button {
    font-family: inherit;
    font-size: 1em;
    padding: 8px 16px;
    cursor: pointer;
    background: #222;
    color: #fff;
    border: 1px solid #555;
  }
  button:hover { background: #333; }
  #error-msg {
    color: #ff6b6b;
    display: none;
    margin-top: 8px;
  }
  form {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #444;
  }
  label { display: block; margin-top: 10px; font-weight: bold; }

  /* Typing animation cursor, only shown while typing */
  .type-target.typing::after {
    content: "|";
    margin-left: 2px;
    animation: blink 0.8s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <h1>This page is private</h1>
  <p>Enter the password to view the content.</p>
  <input type="password" id="password-input" placeholder="Password">
  <br>
  <button onclick="unlock()">Unlock</button>
  <p id="error-msg">Incorrect password. Try again.</p>
</div>

<!-- ENCRYPTED CONTENT WILL BE DECRYPTED INTO HERE -->
<div id="content"></div>

    (PBKDF2) and decrypts the content locally, then injects it into the page.
  - Whatever element in your source content has class="type-target" will be
    typed out character by character. Everything else appears instantly
    (no animation) to keep things fast.

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function deriveKey(password, saltBytes) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBytes, iterations: 200000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

function typeOutElement(el, speedMs) {
  const fullText = el.textContent;
  el.textContent = "";
  el.classList.add("typing");
  let i = 0;
  function step() {
    if (i < fullText.length) {
      el.textContent += fullText.charAt(i);
      i++;
      setTimeout(step, speedMs);
    } else {
      el.classList.remove("typing");
    }
  }
  step();
}

async function unlock() {
  const password = document.getElementById("password-input").value;
  const errorMsg = document.getElementById("error-msg");
  errorMsg.style.display = "none";

  try {
    const salt = b64ToBytes(cipherPayload.salt);
    const iv = b64ToBytes(cipherPayload.iv);
    const ciphertext = b64ToBytes(cipherPayload.ciphertext);

    const key = await deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv }, key, ciphertext
    );

    const html = new TextDecoder().decode(decrypted);
    const contentDiv = document.getElementById("content");
    contentDiv.innerHTML = html;

    document.getElementById("lock-screen").style.display = "none";
    contentDiv.style.display = "block";

    // Quick typewriter effect on the designated element only; everything
    // else in contentDiv is already rendered flat with no animation.
    const typeTarget = contentDiv.querySelector(".type-target");
    if (typeTarget) {
      typeOutElement(typeTarget, 18); // ms per character — quick
    }
  } catch (e) {
    errorMsg.style.display = "block";
  }
}

// Allow pressing Enter to submit
document.getElementById("password-input").addEventListener("keyup", function(e) {
  if (e.key === "Enter") unlock();
});
</script>
